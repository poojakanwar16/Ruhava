{% extends 'base.html' %}
{% load static %}   
{% block title %}Ruhava AI Assistant{% endblock %}
{% block content %}
<head>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .chat-container {
            width: 400px;
            height: 600px;
            margin: 40px auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: #111;
            color: white;
            padding: 18px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .message {
            margin-bottom: 15px;
            padding: 10px 14px;
            border-radius: 10px;
            max-width: 80%;
            line-height: 1.5;
        }

        .bot-message {
            background: #eeeeee;
            margin-right: auto;
        }

        .user-message {
            background: #111;
            color: white;
            margin-left: auto;
        }

        .chat-input {
            display: flex;
            border-top: 1px solid #ddd;
            padding: 10px;
        }

        .chat-input input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            outline: none;
        }

        .chat-input button {
            margin-left: 8px;
            padding: 12px 18px;
            background: #111;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .chat-input button:hover {
            background: #333;
        }
    </style>
</head>

<body>

<div class="chat-container">

    <div class="chat-header">
        🤖 Ruhava AI Assistant
    </div>

    <div class="chat-messages" id="chatMessages">

        <div class="message bot-message">
            Hi! 👋 I'm Ruhava's AI Assistant.
            How can I help you?
        </div>

    </div>

    <div class="chat-input">

        <input
            type="text"
            id="userInput"
            placeholder="Ask something about Ruhava..."
        >

        <button onclick="sendMessage()">
            Send
        </button>

    </div>

</div>


<script>

function sendMessage() {

    const input = document.getElementById("userInput");
    const message = input.value.trim();

    if (!message) {
        return;
    }

    const chatMessages = document.getElementById("chatMessages");

    // Show user message
    const userMessage = document.createElement("div");

    userMessage.className = "message user-message";
    userMessage.textContent = message;

    chatMessages.appendChild(userMessage);

    input.value = "";

    // Ask Django
    fetch(`/ai_assistant/chat/?message=${encodeURIComponent(message)}`)
    .then(response => {
        if (!response.ok) {
            throw new Error("Server error: " + response.status);
        }

        return response.json();
    })
    .then(data => {

        const botMessage = document.createElement("div");

        botMessage.className = "message bot-message";
        botMessage.textContent = data.response;

        chatMessages.appendChild(botMessage);

        chatMessages.scrollTop = chatMessages.scrollHeight;
    })
    .catch(error => {

        console.error("Fetch error:", error);

        const botMessage = document.createElement("div");

        botMessage.className = "message bot-message";
        botMessage.textContent =
            "Sorry, something went wrong. Please try again.";

        chatMessages.appendChild(botMessage);
    });
        
}

</script>

</body>
{% endblock %}
