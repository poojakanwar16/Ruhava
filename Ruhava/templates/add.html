{%extends "base.html" %}
{% block title %}Ruhava_add-products{% endblock %}
{%load static%}
{% block extra_css %}
    <link href="{%static 'shopkeeper.css'%}" rel="stylesheet" />
{% endblock %}
{% block content %}
 <h2 class="mb-4" style="text-align: center;">Add Product</h2>

<form method="POST" enctype="multipart/form-data" class=" p-4 shadow">
    {% csrf_token %}

    <div class="mb-3">
        <label class="form-label">Product Name</label>
        <input type="text" name="name" class="form-control" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Price</label>
        <input type="number" name="price" class="form-control" required>
    </div>

    <div class="mb-3">
        <label class="form-label">colour</label>
        <input type="text" name="colour" class="form-control" required>
    </div>

    <div class="mb-3">
        <label><input type="checkbox" name="sizes" value="S"> S</label>
        <label><input type="checkbox" name="sizes" value="M"> M</label>
        <label><input type="checkbox" name="sizes" value="L"> L</label>
        <label><input type="checkbox" name="sizes" value="XL"> XL</label>
    </div>

    <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea name="description" class="form-control" required></textarea>
    </div>

    <div>
        <label class="form-label">Gender</label>
        <select name="gender" required>
            <option value="">Select</option>
            <option value="Men">Men</option>
            <option value="Women">Women</option>
            <option value="Kids">Kids</option>
        </select>
    </div><br>
    <div>
        <label>Stock</label>
        <input type="number" name="stock" min="1">
    </div><br>
    <div>
        <label>Select Category:</label>
         <select name="category" multiple size="3">
          

         {% for cat in categories %}
         <option value="{{ cat.id }}">{{ cat.name }}</option>
         {% endfor %}
         </select>
    </div>
    <div class="mb-3">
        <label class="form-label">Image</label>
        <input type="file" name="images"  class="form-control"multiple required>
    </div>

    <button type="submit" class="btn btn-primary w-100">Add Product</button>
</form>
        {%endblock%}
