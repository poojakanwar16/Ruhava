{%extends "base.html" %}
{% load static %}
{% block title %}Ruhava_Register{% endblock %}
{% block extra_css %}
           <link href="{%static 'shop.css'%}" rel="stylesheet" />
         {% endblock %}
{% block content %}

   <div class="regis">
         <div class="container mt-5">
        <div class="regis-card">
            <div class="card-header text-center">
                <h4>Registration Form</h4>
            </div>
            <div class="card-body">
                <div class="progress mb-4">
                    <div id="progressBar" class="progress-bar bg-success" role="progressbar" style="width: 33%;" aria-valuenow="33" aria-valuemin="0" aria-valuemax="100" data-step="Step 1 of 3"></div>
                </div>
                <form id="registrationForm" method="post">
                     {% csrf_token %}
                    <!-- Step 1: Personal Information -->
                    <div class="step active" id="step1">
                        <h5><i class="bi bi-person step-icon"></i> Personal Information</h5>
                        <div class="mb-3">
                            <label for="firstName" class="form-label">Full Name</label>
                            <input type="text" class="form-control" id="full_Name" name="full_name" required>
                        </div>
                        <div class="mb-3">
                            <label for="lastName" class="form-label">Address</label>
                            <input type="text" class="form-control" id="address" name="address" required>
                        </div>
                    </div>

                    <!-- Step 2: Contact Information -->
                    <div class="step " id="step2">
                        <h5><i class="bi bi-envelope step-icon"></i> Contact Information</h5>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" name="email" id="email" name="email" required>
                        </div>
                        <div class="mb-3">
                            <label for="phone" class="form-label">Phone</label>
                            <input type="tel" class="form-control" id="phone" name="phone" required>
                        </div>
                        <label>
                         <input type="radio" name="login_as" value="Shopkeeper">
                          Shopkeeper
                        </label>
                        <label>
                          <input type="radio" name="login_as" value="Customer">
                          Customer
                        </label>
                    </div>

                    <!-- Step 3: Account Details -->
                    <div class="step " id="step3">
                        <h5><i class="bi bi-shield-lock step-icon"></i> Account Details</h5>
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control" id="username" name="username" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                    </div>

                    <!-- Navigation Buttons -->
                    <div class="step-buttons">
                        <button type="button" class="btn btn-secondary" id="prevBtn" onclick="changeStep(-1)" disabled>Previous</button>
                        <button type="button" class="btn btn-primary" id="nextBtn" onclick="changeStep(1)">Next</button>
                        <button type="submit" class="btn btn-success d-none" id="submitBtn"> Submit</button>
                    </div><br>
                    <div>
                        <a href="{%  url 'shop:login' %}">Already have account? Login</a>
                    </div>
                </form>
            </div>
        </div>
    </div>  

   </div>

{% endblock %}
