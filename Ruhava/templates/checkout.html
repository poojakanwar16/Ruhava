{% extends "base.html" %}
{% load static %}
{% block title %}Checkout{% endblock %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'order.css' %}">
{% endblock %}

{% block content %}

<div class="checkout-container">

    <h2>Delivery Information</h2>
    <form method="POST">
    {% csrf_token %}

    <div class="form-group">
        <h2>Full Name</h2>
        <input type="text" name="name" value="{{ profile.user.username }}"required>
    </div>

    <div class="form-group">
        <h2>Phone Number</h2>
        <input type="text" name="phone" value="{{ profile.phone }}" required>
    </div>

    <div class="form-group">
        <h2>Address</h2>
        <textarea name="address" rows="3" required>{{ profile.address }}</textarea>
    </div>

    <button type="submit" class="order-btn">
        Continue
    </button>
</form>

</div>

{% endblock %}
